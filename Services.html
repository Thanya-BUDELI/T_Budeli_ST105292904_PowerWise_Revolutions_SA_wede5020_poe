<!DOCTYPE html>
<html lang="en-ZA">

<head>
    <meta charset="UTF-8">
    <!-- This viewport setting helps the page fit phone screens. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerWise Services</title>
    <meta name="description" content="Explore PowerWise monitoring, installation, maintenance and support services.">
    <meta name="keywords" content="household energy services, electricity monitoring, energy advice South Africa">
    <meta name="author" content="Thanya Budeli">
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="CSS/style.css" />

    <!-- the following links have to do with font style -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- This connects the page to the shared JavaScript file. -->
    <script src="JS/script.js" defer></script>
</head>

<body>
    <header>
        <!-- header represents top section of the webpage -->
        <div>
            <!-- Div is a divider used to separate sections of the html content -->
            <h1>PowerWise Revolutions SA</h1>
            <nav>
                <!-- navigation -->
            
            <ul>
                <!-- unordered list:usually represented in bullet points -->
            
            <li><a href="Index.html">Home</a></li>
            <li><a href="about_us.html">about_us</a></li>
            <li><a href="services.html">services</a></li>
            <li><a href="inquiry.html">Inquiry</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            <li><a href="ElectricitySavingTips.html">Electricity Saving Tips</a></li>
            </ul>
            </nav>
        </div>
    </header>
    <main>
        <section>
            <h2>Services</h2>

            <!-- Part 3: visitors can search for a service and choose its category. -->
            <label for="service-search">Search services:</label>
            <input type="text" id="service-search" placeholder="Search services...">

            <label for="service-category">Choose category:</label>
            <select id="service-category">
                <option value="all">All categories</option>
                <option value="monitoring">Monitoring</option>
                <option value="installation">Installation</option>
                <option value="support">Support</option>
            </select>

            <p id="service-count" aria-live="polite"></p>
            <p id="service-empty" hidden>No services match your search.</p>

            <p>We offer a range of services to help you manage your power consumption and ensure reliable energy supply.</p>

            <!-- JavaScript creates the service cards in this space. -->
            <div id="service-list" class="services-list" aria-live="polite"></div>
        </section>
    </main>

    <footer>
        
    </footer>
</body>
</html>
